<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiative Tracker: Mobile/Sidebar Console</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-surface: #1a1a1e;
            --bg-surface-elevated: #26262b;
            --text-main: #e1e1e6;
            --text-muted: #a8a8b3;
            --primary: #4ea8de;
            --success: #04d361;
            --danger: #f75a68;
            --border: #29292e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select, input, button {
            background-color: var(--bg-surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        select { width: 100%; }

        button.btn-primary { background-color: var(--primary); color: #000; font-weight: 600; border: none; }
        button.btn-success { background-color: var(--success); color: #000; font-weight: 600; border: none; }
        button.btn-danger { background-color: var(--danger); color: #fff; border: none; }

        /* Settings Overlay Styling */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-container {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .settings-title {
            font-weight: 600;
            font-size: 16px;
        }

        .settings-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-size: 14px;
        }

        /* Styling for switch or check to the right */
        .setting-control {
            display: flex;
            align-items: center;
        }

        /* Main Scrollable Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Collapsible Drawer Styling */
        details {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        summary {
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            user-select: none;
        }

        details[open] summary {
            border-bottom: 1px solid var(--border);
        }

        .drawer-content {
            padding: 12px;
        }

        /* Image Gallery Grid (Horizontal Scroll on Mobile) */
        .image-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .img-card {
            background-color: var(--bg-surface-elevated);
            border-radius: 6px;
            border: 2px solid transparent;
            flex: 0 0 100px;
            overflow: hidden;
            text-align: center;
        }

        .img-card.active { border-color: var(--primary); }
        .img-card img { width: 100%; height: 60px; object-fit: cover; }
        .img-card span { display: block; font-size: 10px; padding: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Active List */
        .tracker-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .entity-row {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .entity-row.active {
            border-color: var(--primary);
            background-color: #4ea8de10;
        }

        .entity-main {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .init-badge {
            background-color: var(--bg-surface-elevated);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
        }

        .entity-row.active .init-badge {
            background-color: var(--primary);
            color: #000;
        }

        .entity-info .name { font-weight: 600; font-size: 14px; }
        .entity-info .meta { font-size: 11px; color: var(--text-muted); }

        .entity-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hp-badge {
            background: #29292e;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-family: monospace;
        }

        /* Fixed Bottom Combat Bar */
        .combat-sticky-footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .main-loop-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-xl {
            flex: 2;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
        }

        /* Form Layouts */
        .quick-add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-container">
            <div class="settings-header">
                <div class="settings-title">Campaign Settings</div>
                <button class="settings-close-btn" id="closeSettingsBtn">×</button>
            </div>
            <div class="setting-item">
                <span class="setting-label">Show Initiative Roll</span>
                <div class="setting-control"><input type="checkbox" checked></div>
            </div>
            <div class="setting-item">
                <span class="setting-label">Auto-Hide Inactive Turns</span>
                <div class="setting-control"><input type="checkbox"></div>
            </div>
            <div class="setting-item">
                <span class="setting-label">Display Size</span>
                <div class="setting-control"><input type="range" min="1" max="3" value="1"></div>
            </div>
            <div class="setting-item">
                <span class="setting-label">Campaign Name</span>
                <div class="setting-control"><input type="text" placeholder="Default"></div>
            </div>
            <button class="btn-success" style="width: 100%;">Save Changes</button>
        </div>
    </div>

    <header>
        <div class="header-top">
            <select style="max-width: 65%;">
                <option>Campaign: Default</option>
            </select>
            <button style="padding: 6px 10px; font-size: 12px;" id="settingsBtn">Settings</button>
        </div>
    </header>

    <div class="content-scroll">

        <details>
            <summary>📺 Presenter & Media</summary>
            <div class="drawer-content" style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-primary" style="width: 100%;">Open Presenter Window</button>
                <div class="image-row">
                    <div class="img-card"><img src="https://images.unsplash.com/photo-1500622557032-593439235209?w=100"><span>Link_Gazing</span></div>
                    <div class="img-card active"><img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=100"><span>Howls_Castle</span></div>
                    <div class="img-card"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100"><span>SummerBeach</span></div>
                </div>
            </div>
        </details>

        <details>
            <summary>➕ Add Combatant</summary>
            <div class="drawer-content">
                <div class="quick-add-form">
                    <input type="text" placeholder="Name">
                    <div class="form-row">
                        <input type="number" placeholder="Init Roll">
                        <input type="number" placeholder="Max HP">
                    </div>
                    <div class="btn-grid">
                        <button class="btn-success">PC</button>
                        <button class="btn-primary" style="color:#000">NPC</button>
                        <button class="btn-danger">Monster</button>
                    </div>
                </div>
            </div>
        </details>

        <div style="display: flex; justify-content: space-between; font-size: 11px;">
            <button style="padding: 4px 8px; font-size: 11px;">👁 Initiative</button>
            <button style="padding: 4px 8px; font-size: 11px;">👁 Enemy HP</button>
            <button style="padding: 4px 8px; font-size: 11px;">👁 Player HP</button>
        </div>

        <div class="tracker-list">
            <div class="entity-row active">
                <div class="entity-main">
                    <div class="init-badge">5</div>
                    <div class="entity-info">
                        <div class="name">Player 2</div>
                        <div class="meta">PC • Healthy</div>
                    </div>
                </div>
                <div class="entity-actions">
                    <div class="hp-badge">10/10</div>
                    <button style="background:transparent; border:none; color:var(--text-muted)">❌</button>
                </div>
            </div>

            <div class="entity-row">
                <div class="entity-main">
                    <div class="init-badge">3</div>
                    <div class="entity-info">
                        <div class="name">Player 1</div>
                        <div class="meta">PC • Healthy</div>
                    </div>
                </div>
                <div class="entity-actions">
                    <div class="hp-badge">10/10</div>
                    <button style="background:transparent; border:none; color:var(--text-muted)">❌</button>
                </div>
            </div>

            <div class="entity-row">
                <div class="entity-main">
                    <div class="init-badge">1</div>
                    <div class="entity-info">
                        <div class="name">Player 3</div>
                        <div class="meta">PC • Healthy</div>
                    </div>
                </div>
                <div class="entity-actions">
                    <div class="hp-badge">10/10</div>
                    <button style="background:transparent; border:none; color:var(--text-muted)">❌</button>
                </div>
            </div>
        </div>

    </div>

    <footer class="combat-sticky-footer">
        <div class="main-loop-buttons">
            <button style="padding: 0 12px;">⏮</button>
            <button class="btn-primary btn-xl">NEXT TURN ⏭</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
            <button style="font-size: 11px; padding: 6px;">💤 Long Rest</button>
            <button class="btn-danger" style="font-size: 11px; padding: 6px;">⚠️ Clear Monsters</button>
        </div>
    </footer>

    <script>
        // Settings Overlay Logic
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');

        settingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.add('show');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.remove('show');
        });

        // Optional: Close overlay if clicked outside the container
        settingsOverlay.addEventListener('click', (event) => {
            if (event.target === settingsOverlay) {
                settingsOverlay.classList.remove('show');
            }
        });
    </script>

</body>
</html>
