[package]
name = "initiative-tracker-gtk"
version = "0.1.0"
description = "Initiative Tracker — GTK4 / libadwaita frontend"
authors = ["papodaca"]
edition = "2021"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
directories = "6"
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
