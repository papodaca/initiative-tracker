description = "Initiative Tracker — GTK4 / libadwaita frontend"
authors = ["papodaca"]
edition = "2021"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
