<?xml version="1.0" encoding="UTF-8"?>
<!-- Initiative Tracker app icon: a d20 with a lightning bolt on the front face. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6cf5"/>
      <stop offset="1" stop-color="#6d40d4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <path d="M64 24 L103.8 47 L103.8 93 L64 116 L24.2 93 L24.2 47 Z" fill="#000" opacity="0.18"/>

  <!--
    Hexagon silhouette (T top, UR upper-right, LR lower-right, B bottom, LL lower-left, UL upper-left)
    T  (64,20)  UR (103.8,43)  LR (103.8,89)  B (64,112)  LL (24.2,89)  UL (24.2,43)
    Front face F1 (64,36)  F2 (38,81)  F3 (90,81)
  -->
  <g stroke="#3a1f78" stroke-width="1.5" stroke-linejoin="round">
    <!-- Top faces -->
    <path d="M64 20 L24.2 43 L64 36 Z" fill="#b394f6"/>
    <path d="M64 20 L103.8 43 L64 36 Z" fill="#a37ff0"/>
    <!-- Upper side faces -->
    <path d="M24.2 43 L64 36 L38 81 Z" fill="#8f62e6"/>
    <path d="M103.8 43 L64 36 L90 81 Z" fill="#7c4fd6"/>
    <!-- Lower side faces -->
    <path d="M24.2 43 L24.2 89 L38 81 Z" fill="#7647cc"/>
    <path d="M103.8 43 L103.8 89 L90 81 Z" fill="#5f36b0"/>
    <!-- Bottom faces -->
    <path d="M24.2 89 L64 112 L38 81 Z" fill="#6a3ec0"/>
    <path d="M103.8 89 L64 112 L90 81 Z" fill="#54309f"/>
    <path d="M38 81 L90 81 L64 112 Z" fill="#5c35aa"/>
    <!-- Front face -->
    <path d="M64 36 L38 81 L90 81 Z" fill="url(#front)"/>
  </g>

  <!-- Highlight along the top-left edges -->
  <path d="M64 20 L24.2 43" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Lightning bolt -->
  <path d="M69 47 L53 68 L63 68 L58 80 L76 58 L66 58 Z" fill="#3a1f78" opacity="0.35" transform="translate(0.5 1.5)"/>
  <path d="M69 47 L53 68 L63 68 L58 80 L76 58 L66 58 Z" fill="url(#bolt)"/>
</svg>
